services:
  - type: web
    name: whataka-relay
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Minería on-chain: cadena, contrato desplegado y clave del firmante.
      # REPORT_SIGNER_KEY es un secreto: configúralo en el panel de Render, no aquí.
      - key: CHAIN_ID
        value: "80002"
      - key: MINING_CONTRACT
        sync: false
      - key: REPORT_SIGNER_KEY
        sync: false
      # Cartera de donaciones (la del administrador). No se incrusta en el
      # código: se define aquí o en el panel de Render y se cambia al pasar a
      # Polygon real. Mientras esté vacía, la app usa su valor de respaldo.
      - key: DONATION_WALLET
        sync: false
