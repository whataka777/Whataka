services:
  - type: web
    name: whataka-relay
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Minería on-chain: cadena, contrato desplegado y clave del firmante.
      # REPORT_SIGNER_KEY es un secreto: configúralo en el panel de Render, no aquí.
      - key: CHAIN_ID
        value: "80002"
      - key: MINING_CONTRACT
        sync: false
      - key: REPORT_SIGNER_KEY
        sync: false
      # Cartera de donaciones (la del administrador). No se incrusta en el
      # código: se define aquí o en el panel de Render y se cambia al pasar a
      # Polygon real. Mientras esté vacía, la app usa su valor de respaldo.
      - key: DONATION_WALLET
        sync: false
      # TURN para las llamadas. Sin TURN, dos móviles con NAT estricto (4G/5G)
      # no pueden abrir el canal directo y la llamada se queda en "Conectando…".
      # El relé publica estos valores en /api/ice; no se incrustan en la app.
      - key: ICE_TURN_URL
        sync: false
      - key: ICE_TURN_USERNAME
        sync: false
      - key: ICE_TURN_CREDENTIAL
        sync: false
      # Dominio único de la app: el subdominio de Render redirige aquí para que
      # nadie acabe con dos identidades (localStorage es por origen).
      - key: CANONICAL_HOST
        value: whataka.vip
